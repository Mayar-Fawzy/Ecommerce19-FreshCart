<div class="product-grid" [attr.aria-busy]="loading()">
  @if (loading()) {
    @for (_ of skeletons(); track $index) {
      <div class="product-grid__skeleton" aria-hidden="true">
        <ngx-skeleton-loader [theme]="{ display: 'block', width: '100%', height: 'auto', 'aspect-ratio': '1', margin: 0, 'border-radius': '0' }" />
        <div class="product-grid__skeleton-body">
          <ngx-skeleton-loader [theme]="{ width: '40%', height: '12px', margin: 0 }" />
          <ngx-skeleton-loader [theme]="{ width: '90%', height: '16px', margin: 0 }" />
          <ngx-skeleton-loader [theme]="{ width: '55%', height: '12px', margin: 0 }" />
          <ngx-skeleton-loader [theme]="{ width: '35%', height: '22px', margin: '8px 0 0' }" />
        </div>
      </div>
    }
  } @else {
    @for (product of CardProducts(); track product._id) {
      <app-product-card [product]="product" />
    }
  }
</div>
